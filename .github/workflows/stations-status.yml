name: Snapshot de estado de estaciones

# Actualiza public/stations-status.json (fecha del último RINEX de cada estación
# activa, para /estado) y public/stations-history.json (días con datos del
# último año, para /historico). También refresca public/gnss-orbits.json
# (TLE de GPS/GLONASS/Galileo/BeiDou para la ventana horaria de /planeacion).

on:
  schedule:
    - cron: '17 6 * * *' # a diario, 06:17 UTC (~01:17 hora Colombia)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stations-status
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generar snapshot
        run: python scripts/status-snapshot.py

      - name: Órbitas GNSS (TLE)
        run: python scripts/gnss-orbits.py || echo "Sin órbitas nuevas; se conserva el archivo anterior."

      - name: Commit si cambió
        run: |
          if git diff --quiet -- public/stations-status.json public/stations-history.json public/gnss-orbits.json && [ -z "$(git ls-files --others --exclude-standard public/stations-history.json)" ]; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/stations-status.json public/stations-history.json public/gnss-orbits.json
          git commit -m "chore: actualizar snapshot de estado de estaciones"
          git push
