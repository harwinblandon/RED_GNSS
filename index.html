<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <meta name="theme-color" content="#101216" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="H_GNSS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta
      name="description"
      content="Asistente de post-proceso GNSS: estaciones MAGNA-ECO del IGAC, tiempos de ocupación, calendario GPS, efemérides y acceso a RINEX."
    />
    <title>H_TOPOGRAFÍA · Post-proceso GNSS</title>
    <style>
      /* Pantalla de bienvenida: visible hasta que React monta (src/main.tsx la retira). */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #101216; color: #e6e8ec;
        font-family: 'Noto Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity 0.45s ease;
      }
      #splash.out { opacity: 0; pointer-events: none; }
      #splash .plate {
        background: #fff; border-radius: 14px; padding: 18px 22px;
        width: min(78vw, 360px); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
        animation: splash-in 0.6s ease-out both;
      }
      #splash .plate img { display: block; width: 100%; height: auto; }
      #splash .sub { font-size: 14px; letter-spacing: 0.04em; opacity: 0.75; animation: splash-in 0.6s 0.15s ease-out both; }
      #splash .by {
        position: absolute; bottom: max(28px, env(safe-area-inset-bottom));
        display: flex; align-items: center; gap: 10px;
        font-size: 13px; letter-spacing: 0.25em; text-transform: uppercase;
        animation: splash-in 0.6s 0.3s ease-out both;
      }
      #splash .by span { opacity: 0.6; }
      #splash .by img { display: block; height: 34px; width: auto; }
      @keyframes splash-in { from { opacity: 0; transform: translateY(8px); } }
      @media (prefers-reduced-motion: reduce) {
        #splash, #splash * { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="plate"><img src="/brand/logo.png" alt="" /></div>
      <div class="sub">Post-proceso GNSS</div>
      <div class="by"><span>by</span><img src="/brand/h-mark.png" alt="H" /></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
