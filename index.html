<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <meta name="theme-color" content="#101216" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Plan_GNSS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta
      name="description"
      content="Asistente de post-proceso GNSS: estaciones MAGNA-ECO del IGAC, tiempos de ocupación, calendario GPS, efemérides y acceso a RINEX."
    />
    <title>H_TOPOGRAFÍA · Post-proceso GNSS</title>
    <style>
      /* Pantalla de bienvenida: visible hasta que React monta (src/main.tsx la retira). */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: #101216; color: #e6e8ec;
        font-family: 'Noto Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity 0.45s ease;
      }
      #splash.out { opacity: 0; pointer-events: none; }
      #splash .sign {
        position: relative;
        animation: splash-in 0.7s ease-out both;
      }
      /* «by» va fuera del flujo para que la H quede centrada */
      #splash .sign span {
        position: absolute; right: calc(100% + 14px); bottom: 4px;
        font-size: 18px; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.65;
      }
      #splash .sign img { display: block; height: min(32vh, 150px); width: auto; }
      #splash .app {
        font-size: 15px; letter-spacing: 0.35em; opacity: 0.8; margin-top: 10px;
        animation: splash-in 0.7s 0.25s ease-out both;
      }
      @keyframes splash-in { from { opacity: 0; transform: translateY(8px); } }
      @media (prefers-reduced-motion: reduce) {
        #splash, #splash * { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="sign"><span>by</span><img src="/brand/h-mark.svg" alt="H" /></div>
      <div class="app">Plan_GNSS</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
